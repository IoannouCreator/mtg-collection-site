<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="build" content="20261121144902">
  <title>Trade Binder</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../style.css?v=20261121144902">
  <style>
    .trade-intro { color: var(--muted); margin: 0 0 1rem; }
    .trade-tools { display: grid; gap: 0.6rem; grid-template-columns: 1fr auto; align-items: end; margin-bottom: 0.8rem; }
    .trade-tools label { display: grid; gap: 0.2rem; font-size: 0.8rem; color: var(--muted); }
    .trade-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0.8rem; background: var(--surface); }
    .trade-row.picked { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
    .trade-row img, .trade-row .noimg { width: 44px; height: 61px; border-radius: 3px; object-fit: cover; background: var(--surface-2); flex: none; }
    .trade-main { flex: 1; min-width: 0; }
    .trade-prices { text-align: right; font-size: 0.8rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .trade-prices strong { color: var(--text); font-size: 0.95rem; }
    .pick { display: flex; align-items: center; gap: 0.3rem; flex: none; }
    .pick button {
      font: inherit; width: 2.1rem; height: 2.1rem; border-radius: 50%; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text); cursor: pointer; font-size: 1.1rem; line-height: 1;
    }
    .pick button:disabled { opacity: 0.35; cursor: default; }
    .pick .count { min-width: 1.4rem; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
    .tray {
      position: sticky; bottom: 0; z-index: 5; margin-top: 1rem;
      padding: 0.8rem 1rem calc(env(safe-area-inset-bottom) + 0.8rem);
      background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
    }
    .tray-row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
    .tray-row input { flex: 1 1 12rem; font: inherit; font-size: 16px; padding: 0.6rem 0.75rem; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text); }
    .tray-summary { flex: 1 1 100%; font-size: 0.9rem; }
    .tray button.primary { font: inherit; font-weight: 600; padding: 0.65rem 1rem; border: 0; border-radius: var(--radius); background: var(--accent); color: var(--accent-text); cursor: pointer; }
    .tray button.primary:disabled { opacity: 0.5; cursor: default; }
    .tray .link-btn { padding: 0.65rem 0.4rem; }
    .copied { color: var(--up); font-weight: 600; }
    @media (max-width: 560px) {
      /* Phones: prices above the +/− buttons, so the card name keeps the width it needs. */
      .trade-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; grid-template-areas: "img main prices" "img main pick"; column-gap: 0.6rem; row-gap: 0.35rem; align-items: center; }
      .trade-row > img, .trade-row > .noimg { grid-area: img; }
      .trade-main { grid-area: main; }
      .trade-prices { grid-area: prices; }
      .pick { grid-area: pick; justify-self: end; }
      .trade-row .name, .trade-row .row-sub { white-space: normal; }
      .trade-row .row-sub { flex-wrap: wrap; }
      .trade-row .row-title { flex-wrap: wrap; }
    }
    .card-open { cursor: pointer; }
    .trade-row .name.card-open { text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 3px; }
    dialog#viewer {
      border: 0; padding: 0; border-radius: 16px; max-width: min(420px, calc(100vw - 32px)); width: 100%;
      background: var(--surface); color: var(--text); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }
    dialog#viewer::backdrop { background: rgba(0, 0, 0, 0.55); }
    .viewer-body { padding: 1rem; display: grid; gap: 0.75rem; }
    .viewer-body img { width: 100%; height: auto; aspect-ratio: 488 / 680; border-radius: 4.75% / 3.5%; background: var(--surface-2); }
    .viewer-head { display: flex; justify-content: space-between; align-items: start; gap: 0.75rem; }
    .viewer-head h2 { margin: 0; font-size: 1.15rem; }
    .viewer-close { font: inherit; font-size: 1.4rem; line-height: 1; border: 0; background: var(--surface-2); color: var(--text); width: 2.2rem; height: 2.2rem; border-radius: 50%; cursor: pointer; flex: none; }
    .viewer-facts { color: var(--muted); font-size: 0.9rem; }
    .viewer-foot { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; }
    #fallback { width: 100%; min-height: 9rem; font: inherit; font-size: 0.9rem; margin-top: 0.6rem; padding: 0.6rem; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  </style>
</head>
<body>
  <main>
    <h1>Trade binder</h1>
    <p class="trade-intro">Tick the cards you'd like, add your name, then tap <strong>Copy my list</strong> and send it to me
      however you like (WhatsApp, Discord, text…). Prices are guides in pounds: Cardmarket's 7-day average sale price and
      TCGplayer's market price, converted.</p>
    <div class="trade-tools">
      <label>Search<input type="search" id="q" placeholder="Card name" autocomplete="off" autocorrect="off" spellcheck="false"></label>
      <label>Sort
        <select id="sort">
          <option value="name">Name</option>
          <option value="cm">Price: high to low</option>
          <option value="cm_asc">Price: low to high</option>
          <option value="picked">My picks first</option>
        </select>
      </label>
    </div>
    <p class="summary" id="summary">Loading…</p>
    <ul class="results" id="list"></ul>
    <div class="more"><button type="button" id="more" hidden>Show more</button></div>
  </main>
  <div class="tray" id="tray">
    <div class="tray-row">
      <span class="tray-summary" id="tray-summary">Nothing picked yet.</span>
      <input type="text" id="who" placeholder="Your name" autocomplete="name">
      <button type="button" class="primary" id="copy" disabled>Copy my list</button>
      <button type="button" class="link-btn" id="clear" hidden>Clear</button>
    </div>
    <textarea id="fallback" hidden readonly></textarea>
  </div>
  <dialog id="viewer" aria-labelledby="viewer-name">
    <div class="viewer-body">
      <div class="viewer-head">
        <h2 id="viewer-name"></h2>
        <button type="button" class="viewer-close" id="viewer-close" aria-label="Close">×</button>
      </div>
      <img id="viewer-img" alt="">
      <div class="viewer-facts" id="viewer-facts"></div>
      <div class="viewer-foot">
        <div class="trade-prices" id="viewer-prices"></div>
        <div class="pick" id="viewer-pick"></div>
      </div>
    </div>
  </dialog>
  <script src="trades.js?v=20261121144902"></script>
</body>
</html>
